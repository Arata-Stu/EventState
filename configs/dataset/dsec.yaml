name: dsec
root: null
train_split: train
# GEP-comparison/alignment-development default. This uses original DSEC test
# streams for checkpoint selection and is therefore not benchmark-clean for a
# later DSEC-Detection evaluation. For that protocol, set val_split=train and
# provide disjoint, sequence-level train_sequences and val_sequences drawn only
# from the canonical 41 training sequences.
val_split: test
train_sequences: null
val_sequences: null
sequence_length: 8
clip_stride: 1

# DSEC's RGB camera is approximately 20 Hz. Each event tensor uses
# (previous RGB timestamp, current RGB timestamp].
event_window: rgb_interval
sensor_height: 480
sensor_width: 640
rectify_events: true

# The default reproduces GEP's three-channel white-background red/blue event
# frame. The 20-channel temporal voxel representation remains available with
# `representation.type=voxel_grid` and a matching 20-channel model override.
representation:
  type: gep_rgb
  channels: 3
  percentile: 90.0
  event_bins: 10
  polarity_split: true
  voxel_normalization: nonzero_standardize
  normalize_mean: [0.8993729785, 0.7969581015, 0.8928228776]
  normalize_std: [0.2204336077, 0.2921656668, 0.2204992771]

# Generated by tools/prepare_dsec.py. "rectified" can be used for a
# geometry-debug baseline, but is not pixel-aligned to the event camera.
image_directory: aligned_event
event_cache_dir: null

input_height: 448
input_width: 640

augmentation:
  # Cached teacher tokens require deterministic geometry. Set enabled=true
  # only together with teacher.cache_features=false.
  enabled: false
  scale: [0.8, 1.0]
  horizontal_flip_probability: 0.5
