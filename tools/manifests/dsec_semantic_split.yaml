# DSEC-Semantic contains eight official training sequences and three official
# test sequences.  The original release has no validation split, so EventState
# reserves the last two training sequences for development.  Final reported
# test settings must be selected on this validation split, never on test.
train:
  - zurich_city_00_a
  - zurich_city_01_a
  - zurich_city_02_a
  - zurich_city_04_a
  - zurich_city_05_a
  - zurich_city_06_a

val:
  - zurich_city_07_a
  - zurich_city_08_a

test:
  - zurich_city_13_a
  - zurich_city_14_c
  - zurich_city_15_a

