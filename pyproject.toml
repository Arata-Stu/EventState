[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-state"
version = "0.1.0"
description = "Persistent visual state pretraining for event cameras"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.9",
  "hdf5plugin>=5.1,<6",
  "hydra-core>=1.3,<1.4",
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "tensorboard>=2.14",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
prepare = ["opencv-python>=4.8", "numba>=0.59"]
visualize = ["imageio-ffmpeg>=0.5", "matplotlib>=3.8"]
detection = ["pycocotools>=2.0.7"]
dev = ["pytest>=8", "ruff>=0.6"]

# CUDA 13 no longer supports the Volta (sm_70) architecture used by Tesla V100.
# On the Linux training host, keep PyTorch on the final Volta-compatible wheel
# line. macOS falls back to the normal PyPI build for local inspection.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
include = ["event_state*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
